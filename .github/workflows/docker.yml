# Builds the engine image and publishes it to GitHub Container Registry:
#   ghcr.io/krl05op11/saipa-engine:latest   (every push to main)
#   ghcr.io/krl05op11/saipa-engine:X.Y.Z    (every tag vX.Y.Z)
# saipa-installer deploys :latest (installer_config.yaml -> engine.image).
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # The image is ~7 GB (torch + LibreOffice); the runner's default free
      # disk (~14 GB) is too tight for build + export without this.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/krl05op11/saipa-engine
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
